# Stack de desenvolvimento local do Habita+.
# Postgres e MinIO ficam presos em 127.0.0.1 — nunca expor publicamente.
# Portas deslocadas de propósito: esta máquina roda o Regulariza+ (55432 / 9300-9301) e outros
# projetos (5432, 5433, 9002, 54321-54324). Os dois irmãos precisam subir ao mesmo tempo.
name: habita

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-em-producao}
      POSTGRES_DB: ${POSTGRES_DB:-habita}
      TZ: ${TZ:-America/Cuiaba}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habita}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-habita}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-em-producao}
    ports:
      - "127.0.0.1:9310:9000"
      - "127.0.0.1:9311:9001"
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
