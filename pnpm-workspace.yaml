packages:
  - "apps/*"
  - "packages/*"

# Build scripts nativos aprovados (pacotes confiáveis). pnpm 11 bloqueia por padrão e grava a
# decisão aqui. @scarf/scarf fica de fora (telemetria); esbuild é do tsx (seed/migrations).
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  # Usa o Chrome do sistema (PUPPETEER_EXECUTABLE_PATH); não baixa o próprio.
  puppeteer: false
  sharp: true
  # O OCR roda em WASM puro e funcionou sem o script de instalação — negado por padrão.
  tesseract.js: false
  unrs-resolver: true
